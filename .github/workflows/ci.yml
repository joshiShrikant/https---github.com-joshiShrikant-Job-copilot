name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test & Package (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven unit and integration tests
        run: ./mvnw test -B

      - name: Package Spring Boot production JAR
        run: ./mvnw package -DskipTests -B

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/*.xml
          retention-days: 7

  frontend:
    name: Frontend Test & Production Build (Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Angular Karma/Jasmine tests (Headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: npm run build

  containers:
    name: Docker & Operations Verification
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backup/restore scripts & Compose manifests
        run: |
          bash -n scripts/backup-mysql.sh
          bash -n scripts/restore-mysql.sh
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

