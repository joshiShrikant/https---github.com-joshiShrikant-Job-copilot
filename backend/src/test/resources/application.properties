spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:eurojob_copilot_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:12MB}
spring.servlet.multipart.file-size-threshold=64KB

server.port=0
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.default-produces-media-type=application/json
springdoc.paths-to-match=/api/v1/**

app.auth.refresh-token-expiration-days=7
app.auth.cookie-secure=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.jwt.issuer=${JWT_ISSUER:eurojob-copilot}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

app.storage.resumes-path=${RESUME_STORAGE_PATH:${java.io.tmpdir}/eurojob-copilot-test/resumes}
app.storage.max-file-size-bytes=${RESUME_MAX_FILE_SIZE_BYTES:10485760}

