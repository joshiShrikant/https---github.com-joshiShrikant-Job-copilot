spring.application.name=eurojob-copilot-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.banner-mode=console

spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:12MB}
spring.servlet.multipart.file-size-threshold=64KB

server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.default-produces-media-type=application/json
springdoc.paths-to-match=/api/v1/**

app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.auth-max-requests=${RATE_LIMIT_AUTH_MAX_REQUESTS:20}
app.rate-limit.ai-max-requests=${RATE_LIMIT_AI_MAX_REQUESTS:30}
app.rate-limit.api-max-requests=${RATE_LIMIT_API_MAX_REQUESTS:180}
app.rate-limit.max-tracked-clients=${RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

app.auth.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.jwt.issuer=${JWT_ISSUER:eurojob-copilot}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

app.storage.resumes-path=${RESUME_STORAGE_PATH:${java.io.tmpdir}/eurojob-copilot/resumes}
app.storage.max-file-size-bytes=${RESUME_MAX_FILE_SIZE_BYTES:10485760}

app.ingestion.enabled=${JOB_INGESTION_ENABLED:true}
app.ingestion.connect-timeout-ms=${JOB_INGESTION_CONNECT_TIMEOUT_MS:5000}
app.ingestion.read-timeout-ms=${JOB_INGESTION_READ_TIMEOUT_MS:15000}
app.ingestion.default-max-pages=${JOB_INGESTION_MAX_PAGES:3}
app.ingestion.max-results-per-provider=${JOB_INGESTION_MAX_RESULTS_PER_PROVIDER:100}
app.ingestion.arbeitnow.enabled=${ARBEITNOW_ENABLED:true}
app.ingestion.arbeitnow.base-url=${ARBEITNOW_BASE_URL:https://www.arbeitnow.com/api/job-board-api}
app.ingestion.arbeitnow.max-pages=${ARBEITNOW_MAX_PAGES:3}
app.ingestion.adzuna.enabled=${ADZUNA_ENABLED:true}
app.ingestion.adzuna.base-url=${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api/jobs}
app.ingestion.adzuna.app-id=${ADZUNA_APP_ID:}
app.ingestion.adzuna.app-key=${ADZUNA_APP_KEY:}
app.ingestion.adzuna.results-per-page=${ADZUNA_RESULTS_PER_PAGE:50}
app.ingestion.adzuna.max-pages-per-country=${ADZUNA_MAX_PAGES_PER_COUNTRY:2}
app.ingestion.scheduler.enabled=${JOB_INGESTION_SCHEDULER_ENABLED:true}
app.ingestion.scheduler.cron=${JOB_INGESTION_CRON:0 0 */6 * * *}
app.ingestion.scheduler.expiration-cron=${JOB_STALE_EXPIRATION_CRON:0 30 2 * * *}
app.ingestion.scheduler.zone=${JOB_INGESTION_ZONE:UTC}
app.ingestion.scheduler.stale-expiration-days=${JOB_STALE_EXPIRATION_DAYS:45}
app.ingestion.scheduler.lookback-hours=${JOB_INGESTION_LOOKBACK_HOURS:72}

app.matching.max-batch-jobs=${MATCHING_MAX_BATCH_JOBS:500}
app.matching.weights.technical-skills=${MATCHING_WEIGHT_SKILLS:40}
app.matching.weights.experience=${MATCHING_WEIGHT_EXPERIENCE:20}
app.matching.weights.job-title=${MATCHING_WEIGHT_TITLE:15}
app.matching.weights.location=${MATCHING_WEIGHT_LOCATION:10}
app.matching.weights.sponsorship=${MATCHING_WEIGHT_SPONSORSHIP:10}
app.matching.weights.salary=${MATCHING_WEIGHT_SALARY:5}

app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:10000}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:75000}
app.ai.max-input-chars=${AI_MAX_INPUT_CHARS:18000}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.gemini.max-tokens=${GEMINI_MAX_TOKENS:8192}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.max-tokens=${OPENAI_MAX_TOKENS:4096}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-latest}
app.ai.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:4096}

app.sponsorship.ind.enabled=${IND_SPONSOR_SYNC_ENABLED:true}
app.sponsorship.ind.register-url=${IND_REGISTER_URL:https://ind.nl/en/public-register-recognised-sponsors/public-register-regular-labour-and-highly-skilled-migrants}
app.sponsorship.ind.connect-timeout-ms=${IND_CONNECT_TIMEOUT_MS:5000}
app.sponsorship.ind.read-timeout-ms=${IND_READ_TIMEOUT_MS:20000}
app.sponsorship.ind.user-agent=${IND_USER_AGENT:EuroJobCopilot/1.0 (+https://eurojobcopilot.com)}
app.sponsorship.ind.scheduler-enabled=${IND_SCHEDULER_ENABLED:false}
app.sponsorship.ind.sync-cron=${IND_SYNC_CRON:0 15 3 * * *}
app.sponsorship.ind.sync-zone=${IND_SYNC_ZONE:UTC}

app.autopilot.scheduler.enabled=${AUTOPILOT_SCHEDULER_ENABLED:true}
app.autopilot.scheduler.cron=${AUTOPILOT_CRON:0 15 */6 * * *}
app.autopilot.scheduler.zone=${AUTOPILOT_ZONE:UTC}
app.autopilot.manual-refresh-cooldown-seconds=${AUTOPILOT_MANUAL_REFRESH_COOLDOWN_SECONDS:120}
app.autopilot.max-notifications-per-run=${AUTOPILOT_MAX_NOTIFICATIONS_PER_RUN:10}
app.autopilot.max-ai-analyses-per-run=${AUTOPILOT_MAX_AI_ANALYSES_PER_RUN:3}

app.notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from-address=${NOTIFICATIONS_EMAIL_FROM:no-reply@eurojobcopilot.com}

