spring.config.activate.on-profile=test

spring.datasource.url=jdbc:h2:mem:eurojob_copilot_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.liquibase.enabled=false

app.scheduling.enabled=false
app.rate-limit.enabled=false

app.ingestion.enabled=false
app.ingestion.max-results-per-provider=50
app.ingestion.arbeitnow.enabled=false
app.ingestion.adzuna.enabled=false
app.ingestion.scheduler.enabled=false

app.ai.enabled=false

app.sponsorship.ind.enabled=false
app.sponsorship.ind.scheduler-enabled=false

app.autopilot.scheduler.enabled=false
app.autopilot.manual-refresh-cooldown-seconds=0

app.notifications.email.enabled=false

logging.level.root=WARN
logging.level.com.eurojobcopilot=INFO

