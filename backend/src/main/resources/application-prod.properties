spring.config.activate.on-profile=prod

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.lifecycle.timeout-per-shutdown-phase=30s

server.shutdown=graceful
server.forward-headers-strategy=framework

management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.com.eurojobcopilot=INFO

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.eurojobcopilot.com}
app.storage.resumes-path=${RESUME_STORAGE_PATH:/var/lib/eurojob-copilot/resumes}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

