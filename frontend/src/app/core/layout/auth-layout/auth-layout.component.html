<div class="auth-page-shell">
  <header class="auth-topbar">
    <a routerLink="/dashboard" class="brand-link" aria-label="Return to EuroJob Copilot workspace">
      <span class="brand-mark" aria-hidden="true">
        <span class="material-symbols-outlined">flight_takeoff</span>
      </span>
      <span class="brand-wordmark">
        EuroJob<span class="brand-accent">Copilot</span>
      </span>
    </a>

    <div class="topbar-actions">
      <a routerLink="/dashboard" class="workspace-link">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        <span>Workspace</span>
      </a>

      <button
        type="button"
        class="theme-toggle-btn"
        (click)="theme.toggleTheme()"
        [attr.aria-label]="theme.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="theme.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      >
        <span class="material-symbols-outlined" aria-hidden="true">
          {{ theme.isDarkMode() ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <router-outlet />
    </div>
  </main>

  <footer class="auth-footer">
    <p>European tech job discovery, visa sponsorship verification, and AI application copilot.</p>
  </footer>
</div>
