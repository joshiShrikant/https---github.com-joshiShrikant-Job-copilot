  /api/v1/resumes/upload:
    post:
      tags:
      - Resumes
      summary: Upload master resume
      description: "Validates extension, MIME type, file magic numbers / OOXML ZIP\
        \ structure, and 10MB size limit; securely stores a PDF or DOCX master resume\
        \ under a UUID-keyed path."
      operationId: uploadMasterResume
      requestBody:
        description: Multipart form payload containing the resume document and display
          title
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or DOCX resume file (max 10MB)
                title:
                  type: string
                  description: Display title for the uploaded master resume (max 200
                    characters)
                  example: Master Full-Stack Java Resume 2026
                  maxLength: 200
                  minLength: 1
              required:
              - file
              - title
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Master resume uploaded and stored successfully
          content:
            application/json:
              schema:
