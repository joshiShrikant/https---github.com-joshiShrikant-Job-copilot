      type: object
      description: Job board / discovery connector coverage and refresh telemetry
      properties:
        sourceProvider:
          type: string
          example: ARBEITNOW
        activeJobsCount:
          type: integer
          format: int64
        sharePercentage:
          type: number
          description: Percentage share of collected active jobs from this provider
          example: 62.5
        lastFetchAt:
          type: string
          format: date-time
        lastFetchStatus:
          type: string
          example: SUCCESS
        totalRunsLogged:
          type: integer
          format: int64
    IngestionStatusResponse:
      type: object
      description: "Current runtime health, scheduler configuration, and provider\
        \ status of job ingestion"
      properties:
        ingestionEnabled:
          type: boolean
          description: Global ingestion enabled flag
          example: true
        schedulerEnabled:
          type: boolean
          description: Periodic scheduler enabled flag
          example: true
        cronExpression:
          type: string
          description: Active discovery cron expression
          example: 0
        cronZone:
          type: string
          description: Cron evaluation timezone
          example: UTC
        staleExpirationDays:
          type: integer
          format: int32
          description: Stale job expiration window in days
          example: 45
        running:
          type: boolean
          description: Whether an ingestion batch is currently executing
          example: false
        activeTarget:
          type: string
          description: "Target currently executing (ALL or provider identifier), null\
            \ when idle"
        lastRunStartedAt:
          type: string
          format: date-time
          description: Timestamp when the most recent run began
        lastRunCompletedAt:
          type: string
          format: date-time
          description: Timestamp when the most recent run completed
        activeJobsCount:
          type: integer
          format: int64
          description: Count of active jobs currently indexed
          example: 342
        totalJobsCount:
          type: integer
          format: int64
          description: Total jobs persisted across active and inactive states
          example: 410
        providers:
          type: array
          description: Health and last run summary for each registered connector
          items:
            $ref: "#/components/schemas/ProviderHealthStatusDto"
    JobFetchLogDto:
      type: object
      description: Audit telemetry record for a single provider ingestion run
      properties:
        id:
          type: integer
          format: int64
          description: Log database identifier
          example: 101
        providerName:
          type: string
          description: Canonical provider name
          example: ADZUNA
        status:
          type: string
          description: Execution status outcome
          enum:
          - SUCCESS
          - PARTIAL_SUCCESS
          - FAILED
          example: SUCCESS
        jobsFetched:
          type: integer
          format: int32
          description: Raw postings fetched from upstream API
          example: 50
        jobsInserted:
          type: integer
          format: int32
          description: New jobs inserted
          example: 18
        jobsUpdated:
          type: integer
          format: int32
          description: Existing jobs updated or enriched
          example: 4
        jobsSkippedDuplicates:
          type: integer
          format: int32
          description: Duplicate postings skipped
          example: 28
        executionDurationMs:
          type: integer
          format: int64
          description: Provider polling duration in milliseconds
          example: 312
        errorMessage:
          type: string
          description: Truncated upstream error or partial failure details when applicable
        fetchedAt:
          type: string
          format: date-time
          description: UTC timestamp when the fetch started
    ProviderHealthStatusDto:
      type: object
      description: Configured state and latest fetch telemetry for a registered job
        provider
      properties:
        providerName:
          type: string
          description: Provider identifier
          example: ADZUNA
        enabled:
          type: boolean
          description: Whether the connector is enabled and properly configured
          example: true
        lastRun:
          $ref: "#/components/schemas/JobFetchLogDto"
          description: "Most recent recorded fetch log for this provider, if any"
    PagedFetchLogsResponse:
      type: object
      description: Paginated slice of historical job ingestion fetch logs
      properties:
        items:
          type: array
          description: Fetch log entries ordered newest first
          items:
            $ref: "#/components/schemas/JobFetchLogDto"
        page:
          type: integer
          format: int32
          description: Zero-based page index
          example: 0
        size:
          type: integer
          format: int32
          description: Page size
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total matching log records
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total available pages
          example: 3
        last:
          type: boolean
          description: Whether this is the last page
          example: false
  securitySchemes:
    BearerAuth:
      type: http
      description: Enter JWT Bearer access token to authorize protected API calls.
      name: BearerAuth
      scheme: bearer
      bearerFormat: JWT
