      - BearerAuth: []
components:
  schemas:
    ApiErrorResponse:
      type: object
      description: Standard API error response
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp when error occurred
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP error reason
          example: Bad Request
        message:
          type: string
          description: Human-readable error description
          example: Validation failed for one or more fields
        path:
          type: string
          description: Request path
          example: /api/v1/auth/register
        validationErrors:
          type: array
          description: Field-level validation errors if applicable
          items:
            $ref: "#/components/schemas/ValidationErrorItem"
    ValidationErrorItem:
      type: object
      description: Field-level request validation failure detail
      properties:
        field:
          type: string
          description: Name of the invalid field
          example: email
        rejectedValue:
          type: string
          description: Rejected input value (masked for sensitive fields)
          example: invalid-email
        message:
          type: string
          description: Validation error description
          example: Must be a valid email address
    TailoredResumeEducationDto:
      type: object
      description: Verified academic education entry carried into the tailored CV
      properties:
        institution:
          type: string
          description: Verified university or college name
          example: Technical University of Munich
          maxLength: 200
          minLength: 0
        degree:
          type: string
          description: Verified degree title
          example: M.Sc.
          maxLength: 150
          minLength: 0
        fieldOfStudy:
          type: string
          description: Verified academic field
          example: Computer Science
          maxLength: 150
          minLength: 0
        startDate:
          type: string
          format: date
          description: Start date
          example: 2016-10-01
        endDate:
          type: string
          format: date
          description: Completion date
          example: 2018-09-30
        gradeOrGpa:
          type: string
          description: Grade or GPA if recorded
          example: 1.3
          maxLength: 50
          minLength: 0
        country:
          type: string
          description: Country of study
          example: Germany
          maxLength: 100
          minLength: 0
      required:
      - degree
      - fieldOfStudy
      - institution
    TailoredResumeExperienceDto:
      type: object
      description: Tailored work experience entry preserving verified employer/dates
        while sharpening bullets for target JD
      properties:
        companyName:
          type: string
          description: Verified employer name
          example: Adyen N.V.
          maxLength: 200
          minLength: 0
        designation:
          type: string
          description: Verified role title
          example: Senior Java Backend Engineer
          maxLength: 150
          minLength: 0
        location:
          type: string
          description: Work location
          example: "Amsterdam, Netherlands"
          maxLength: 150
          minLength: 0
        startDate:
          type: string
          format: date
          description: Verified start date
          example: 2022-03-01
        endDate:
          type: string
          format: date
          description: Verified end date (null when current is true)
          example: 2025-12-31
        current:
          type: boolean
          description: Whether this is a current ongoing position
          example: true
        originalBullets:
          type: array
          description: Original factual bullets/statements from candidate profile
            or master CV
          items:
            type: string
            maxLength: 600
            minLength: 0
          maxItems: 20
          minItems: 0
        tailoredBullets:
          type: array
          description: ATS-sharpened achievement bullets strictly grounded in original
            experience evidence
          items:
            type: string
            maxLength: 600
            minLength: 0
          maxItems: 15
          minItems: 0
        matchedKeywords:
          type: array
          description: Target JD keywords authentically reflected in this role
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 25
          minItems: 0
        relevanceScore:
          type: integer
          format: int32
          description: Role relevance score (0-100) relative to target job description
          example: 92
      required:
      - companyName
      - designation
    TailoredResumeProjectDto:
      type: object
      description: Verified project entry emphasized for relevance to target role
      properties:
        name:
          type: string
          description: Verified project title
          example: SEPA Instant Settlement Engine
          maxLength: 150
          minLength: 0
        description:
          type: string
          description: Role-aligned summary of the verified project
          maxLength: 1500
          minLength: 0
        tailoredBullets:
          type: array
          description: Highlight bullets grounded in project description/master CV
          items:
            type: string
            maxLength: 500
            minLength: 0
          maxItems: 10
          minItems: 0
        technologies:
          type: array
          description: Verified project tech stack
          example:
          - Java 21
          - Spring Boot
          - PostgreSQL
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 25
          minItems: 0
        url:
          type: string
          description: Verified repository or demo URL
          maxLength: 255
          minLength: 0
      required:
      - name
    UpdateTailoredResumeRequest:
      type: object
      description: Request payload to save human edits to an existing tailored resume
        draft and recalculate ATS keyword coverage
      properties:
        title:
          type: string
          description: Optional updated title for this tailored CV draft
          example: Staff Java Architect · Adyen N.V. (v1)
          maxLength: 200
          minLength: 0
        templateName:
          type: string
          description: Selected visual layout template
          enum:
          - MODERN
          - MINIMAL_ATS
          - EUROPASS
          - CLASSIC
          example: MINIMAL_ATS
        tailoredSummary:
          type: string
          description: Edited executive summary
          maxLength: 2500
          minLength: 0
        highlightedSkills:
          type: array
          description: Edited highlighted skills list
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        additionalSkills:
          type: array
          description: Edited additional skills list
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        optimizedExperiences:
          type: array
          description: Edited tailored work experience entries
          items:
            $ref: "#/components/schemas/TailoredResumeExperienceDto"
          maxItems: 25
          minItems: 0
        projects:
          type: array
          description: Edited tailored project entries
          items:
            $ref: "#/components/schemas/TailoredResumeProjectDto"
          maxItems: 15
          minItems: 0
        educations:
          type: array
          description: Edited education entries
          items:
            $ref: "#/components/schemas/TailoredResumeEducationDto"
          maxItems: 15
          minItems: 0
        languages:
          type: array
          description: Edited spoken languages
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 20
          minItems: 0
        certifications:
          type: array
          description: Edited certifications
          items:
            type: string
            maxLength: 150
            minLength: 0
          maxItems: 20
          minItems: 0
    TailoredResumeDataDto:
      type: object
      description: Canonical structured tailored resume content stored in resume_data_json
      properties:
        header:
          $ref: "#/components/schemas/TailoredResumeHeaderDto"
          description: Candidate header section derived from verified profile details
        tailoredSummary:
          type: string
          description: JD-aligned professional executive summary strictly grounded
            in verified experience
          maxLength: 2500
          minLength: 0
        highlightedSkills:
          type: array
          description: Verified candidate skills prioritized for alignment with the
            target JD
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        additionalSkills:
          type: array
          description: Remaining verified candidate skills retained for breadth
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        matchedKeywords:
          type: array
          description: Target JD keywords demonstrably covered across the tailored
            resume
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        missingKeywords:
          type: array
          description: "Target JD keywords absent from verified candidate evidence\
            \ (explicit gaps, never fabricated)"
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 40
          minItems: 0
        tailoringRationale:
          type: string
          description: Explanation of how experience and skills were framed for this
            target role
          maxLength: 2000
          minLength: 0
        optimizedExperiences:
          type: array
          description: Tailored work experience blocks anchored to verified employers
            and dates
          items:
            $ref: "#/components/schemas/TailoredResumeExperienceDto"
          maxItems: 25
          minItems: 0
        projects:
          type: array
          description: Verified candidate projects emphasized for this role
          items:
            $ref: "#/components/schemas/TailoredResumeProjectDto"
          maxItems: 15
          minItems: 0
        educations:
          type: array
          description: Verified academic education entries
          items:
            $ref: "#/components/schemas/TailoredResumeEducationDto"
          maxItems: 15
          minItems: 0
        languages:
          type: array
          description: Verified spoken languages
          example:
          - English (C2)
          - German (B1)
          items:
            type: string
            maxLength: 100
            minLength: 0
          maxItems: 20
          minItems: 0
        certifications:
          type: array
          description: Verified certifications
          example:
          - AWS Certified Solutions Architect
          items:
            type: string
            maxLength: 150
            minLength: 0
          maxItems: 20
          minItems: 0
        groundingWarnings:
          type: array
          description: Verification notices when AI claims were filtered or truncated
            to prevent hallucination
          items:
            type: string
            maxLength: 350
            minLength: 0
          maxItems: 30
          minItems: 0
    TailoredResumeHeaderDto:
      type: object
      description: Verified candidate header block displayed at the top of the tailored
        CV
      properties:
        fullName:
          type: string
          description: Candidate full name
          example: Shrikant Joshi
          maxLength: 200
          minLength: 0
        headline:
          type: string
          description: Role-aligned professional headline grounded in verified candidate
            title
          example: Senior Java Backend Architect
          maxLength: 150
          minLength: 0
        email:
          type: string
          description: Candidate email address
          example: shrikant@example.com
          maxLength: 150
          minLength: 0
        location:
          type: string
          description: Candidate current location label
          example: "Berlin, Germany"
          maxLength: 150
          minLength: 0
        country:
          type: string
          description: Candidate current country
