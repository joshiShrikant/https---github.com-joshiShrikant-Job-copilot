          type: string
          description: Updated communication channel
          enum:
          - LINKEDIN
          - EMAIL
          - PHONE
          - RECRUITER_PORTAL
          - OTHER
        messageType:
          type: string
          description: Updated message category
          enum:
          - LINKEDIN_CONNECTION
          - OUTREACH
          - INITIAL_OUTREACH
          - FOLLOW_UP
          - POST_INTERVIEW_THANKS
          - OFFER_NEGOTIATION
        subjectLine:
          type: string
          description: Updated subject line
          maxLength: 255
          minLength: 0
        messageBody:
          type: string
          description: Updated editable message content
          maxLength: 8000
          minLength: 0
        followUpReminderDate:
          type: string
          format: date
          description: Updated follow-up reminder date
        clearFollowUpReminderDate:
          type: boolean
          default: false
          description: "When true, clears followUpReminderDate"
        reminderCompleted:
          type: boolean
          description: Whether the follow-up reminder has been completed
        action:
          type: string
          default: SAVE_DRAFT
          description: "Draft workflow action: SAVE_DRAFT (keeps unsent), APPROVE\
            \ (marks reviewed/ready without auto-sending), or MARK_SENT (requires\
            \ explicitApprovalConfirmed=true)"
