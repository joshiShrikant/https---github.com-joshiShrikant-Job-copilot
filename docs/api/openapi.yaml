          type: string
          description: Country-specific statutory visa pathway and register summary
        officialRegisterUrl:
          type: string
          description: Authoritative official register or government guidance URL
            for the job's country
        verifiedAt:
          type: string
          format: date-time
          description: Verification or latest registry check UTC timestamp
        evidenceSignals:
          type: array
