    SponsorshipBreakdownDto:
      type: object
      description: Combined job-level and company-registry visa sponsorship intelligence
        breakdown
      properties:
        sponsorStatus:
          type: string
          description: Effective sponsorship classification on the job listing
          enum:
          - VERIFIED_SPONSOR
          - SPONSORSHIP_MENTIONED
          - RELOCATION_OFFERED
          - UNCONFIRMED
          - NO_SPONSORSHIP
          example: VERIFIED_SPONSOR
        detailedStatus:
          type: string
          description: Granular 6-state sponsorship status
          enum:
          - VERIFIED_SPONSOR
          - SPONSORSHIP_MENTIONED
          - RELOCATION_ASSISTANCE_MENTIONED
          - POSSIBLE_UNCONFIRMED
          - NOT_MENTIONED
          - UNAVAILABLE
          example: VERIFIED_SPONSOR
        detailedStatusLabel:
          type: string
          description: Display label for detailedStatus
          example: Verified sponsor
        vacancyStatus:
          type: string
          description: Vacancy-level sponsorship signal evaluated independently from
            employer accreditation
          enum:
          - VERIFIED_SPONSOR
          - SPONSORSHIP_MENTIONED
          - RELOCATION_ASSISTANCE_MENTIONED
          - POSSIBLE_UNCONFIRMED
          - NOT_MENTIONED
          - UNAVAILABLE
          example: NOT_MENTIONED
        vacancyStatusLabel:
          type: string
          description: Display label for vacancyStatus
          example: Not mentioned
        vacancySponsorshipConfirmed:
          type: boolean
          description: True only when the specific vacancy text/AI analysis explicitly
            mentions sponsorship
          example: false
        vacancySponsorshipAssumed:
          type: boolean
          description: Always false unless explicitly confirmed at vacancy level
          example: false
        confidenceLevel:
          type: string
          description: Sponsorship confidence classification
          enum:
          - VERIFIED
          - HIGH
          - MEDIUM
          - LOW
          - UNVERIFIED
          example: VERIFIED
        summary:
          type: string
          description: Human-readable sponsorship verdict explaining evidence and
            confidence
        vacancyCaveat:
          type: string
          description: Explicit warning reminding candidates not to assume recognized
            sponsor accreditation covers every vacancy
