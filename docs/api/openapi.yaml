  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh JWT access token
      description: "Rotates the refresh token supplied via HttpOnly cookie or optional\
        \ request body, enforces replay detection, and issues a new JWT access token."
      operationId: refreshToken
      parameters:
      - name: refresh_token
        in: cookie
        description: HttpOnly refresh token cookie issued at registration/login
        required: false
        schema:
          type: string
      requestBody:
        content:
